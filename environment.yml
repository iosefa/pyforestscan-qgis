name: pyforestscan-qgis
# Developer/test environment only. Community users install the plugin ZIP in
# their existing QGIS and use its optional private-engine setup when needed.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - qgis=4.2
  - gdal
  # Rasterio is used by the test fixtures/assertions, not by the plugin.
  - rasterio>=1.4
  - numpy>=2.3.1
  - scipy>=1.16.0
